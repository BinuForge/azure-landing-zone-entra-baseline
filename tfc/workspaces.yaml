# HCP Terraform projects, workspaces and variable sets.
# Workspace name = <prefix>-<area>-<level>-<component>-<env> (docs/naming.md).
# "reads" lists the workspaces whose outputs this one reads with tfe_outputs.
# The tfc root's own workspace (lab-tfc-l0-core-prd) is created by bootstrap/, not here.

projects:
  azure-platform:
    description: Azure platform levels 0-3. Local execution, run by GitHub Actions with OIDC.
  entra-platform:
    description: Entra ID baseline. Local execution, run by GitHub Actions with OIDC.
  azure-workloads:
    description: Level-4 workloads. Remote execution with HCP Terraform dynamic credentials.

workspaces:
  - area: azure
    level: l0
    component: org
    env: prd
    project: azure-platform
    execution_mode: local
    description: Management groups and subscription placement. Pipeline identities come from bootstrap (ADR-0012).
    reads: []

  - area: azure
    level: l1
    component: governance
    env: prd
    project: azure-platform
    execution_mode: local
    description: Subscriptions and the policy baseline.
    reads: [azure-l0-org-prd]

  - area: azure
    level: l2
    component: management
    env: prd
    project: azure-platform
    execution_mode: local
    description: Log Analytics and budgets.
    reads: [azure-l1-governance-prd]

  - area: azure
    level: l2
    component: connectivity
    env: prd
    project: azure-platform
    execution_mode: local
    description: Hub network and cost-flagged network services.
    reads: [azure-l1-governance-prd, azure-l2-management-prd]

  - area: azure
    level: l2
    component: dns
    env: prd
    project: azure-platform
    execution_mode: local
    description: Central private DNS zones.
    reads: [azure-l1-governance-prd, azure-l2-connectivity-prd]

  - area: azure
    level: l3
    component: landingzones
    env: prd
    project: azure-platform
    execution_mode: local
    description: Landing zone vending (corp-nonprod, corp-prod, sandbox). Designed, not deployed (ADR-0004).
    reads: [azure-l1-governance-prd, azure-l2-management-prd, azure-l2-connectivity-prd, azure-l2-dns-prd]

  - area: azure
    level: l3
    component: aiservices
    env: prd
    project: azure-platform
    execution_mode: local
    description: Shared AI services landing zone - Foundry, APIM gateway, prompt log workspace (ADR-0007).
    reads: [azure-l1-governance-prd, azure-l2-management-prd, azure-l2-connectivity-prd, azure-l2-dns-prd]

  - area: azure
    level: l4
    component: opsagent
    env: np
    project: azure-workloads
    execution_mode: remote
    description: Ops agent - runner identity roles, Foundry project consumer (threat-model-ai.md).
    reads: [azure-l2-management-prd, azure-l3-aiservices-prd]

  - area: entra
    level: l0
    component: org
    env: prd
    project: entra-platform
    execution_mode: local
    description: Persona groups, owned by the level's apply identity (ADR-0016).
    reads: []

  - area: entra
    level: l0
    component: privileged
    env: prd
    project: entra-platform
    execution_mode: local
    description: Tier 0 - restricted administrative unit, exclusion groups, custom roles, role-assignable groups, PIM. CI plans; the maintainer applies (ADR-0016).
    reads: [entra-l0-org-prd]

  - area: entra
    level: l1
    component: governance
    env: prd
    project: entra-platform
    execution_mode: local
    description: Authorisation, consent, authentication methods and cross-tenant policies. Entra diagnostics are in bootstrap (ADR-0016).
    reads: [entra-l0-org-prd]

  - area: entra
    level: l1
    component: ca
    env: prd
    project: entra-platform
    execution_mode: local
    description: Named locations, authentication strengths, Conditional Access baseline.
    reads: [entra-l0-org-prd, entra-l0-privileged-prd]

# Variable sets only reach remote-execution workspaces; local runs take variables from GitHub Actions.
# Values that identify the tenant are named by `input` and supplied from git-ignored env/*.auto.tfvars.
variable_sets:
  azure-workload-credentials:
    description: HCP dynamic credentials for level 4. Plan and apply use separate identities (ADR-0012).
    workspaces: [azure-l4-opsagent-np]
    variables:
      TFC_AZURE_PROVIDER_AUTH:
        category: env
        value: "true"
        description: Use HCP dynamic credentials; no client secret exists.
      TFC_AZURE_PLAN_CLIENT_ID:
        category: env
        input: l4_plan_client_id
        description: lab-azure-l4-plan, trusted for run_phase plan only. No TFC_AZURE_RUN_CLIENT_ID fallback is set.
      TFC_AZURE_APPLY_CLIENT_ID:
        category: env
        input: l4_apply_client_id
        description: lab-azure-l4-apply, trusted for run_phase apply only.
      ARM_TENANT_ID:
        category: env
        input: tenant_id
      ARM_SUBSCRIPTION_ID:
        category: env
        input: subscription_id

  azure-opsagent-inputs:
    description: Level 4 inputs that are identifiers, not credentials.
    workspaces: [azure-l4-opsagent-np]
    variables:
      runner_object_id:
        category: terraform
        input: opsagent_runner_object_id
        description: Object ID of lab-azure-l4-opsagent-run (bootstrap output). Level 4 grants it read roles.
      TFE_ORGANIZATION:
        category: env
        input: hcp_organization
        description: Organisation for tfe_outputs. Remote runs do not get the workflow's environment.
