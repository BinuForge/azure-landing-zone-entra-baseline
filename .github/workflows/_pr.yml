name: _pr

# Offline checks for one Terraform directory. Called by pr.yml once per root or module.
on:
  workflow_call:
    inputs:
      working_directory:
        type: string
        required: true

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.17.0
  TFLINT_VERSION: v0.65.0

jobs:
  checks:
    name: ${{ inputs.working_directory }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ env.TFLINT_VERSION }}

      - name: Format
        run: terraform fmt -check -recursive -diff

      - name: Init (no backend, no credentials)
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

      - name: Lint
        env:
          GITHUB_TOKEN: ${{ github.token }} # avoids rate limits when tflint downloads plugins
        run: |
          tflint --init --config="$GITHUB_WORKSPACE/.tflint.hcl"
          tflint --config="$GITHUB_WORKSPACE/.tflint.hcl" --format=compact

      - name: Test (mock providers only)
        env:
          DIR: ${{ inputs.working_directory }}
        run: |
          if [ -d tests ]; then
            terraform test
          else
            echo "::warning::No terraform tests in ${DIR}"
          fi
