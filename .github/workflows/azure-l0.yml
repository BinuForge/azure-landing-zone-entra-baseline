name: azure-l0

# Level 0: management groups. A pull request plans with the read-only identity and comments the plan.
# A merge to main plans again, waits for approval in lab-azure-l0-apply, then applies that saved plan.
on:
  pull_request:
    branches: [main]
    paths:
      - azure/level-0-org/**
      - .github/workflows/azure-l0.yml
      - .github/workflows/_plan.yml
      - .github/workflows/_apply.yml
  push:
    branches: [main]
    paths:
      - azure/level-0-org/**
      - .github/workflows/azure-l0.yml
      - .github/workflows/_plan.yml
      - .github/workflows/_apply.yml
  workflow_dispatch:

# Deny everything by default; each job grants only what its called workflow needs.
permissions: {}

# One run per level at a time, never cancelled part way through an apply.
concurrency:
  group: azure-l0
  cancel-in-progress: false

jobs:
  plan:
    uses: ./.github/workflows/_plan.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    with:
      working_directory: azure/level-0-org
      environment: lab-azure-l0-plan
      comment: ${{ github.event_name == 'pull_request' }}
    # Brings secrets into scope so the called job's environment secrets resolve. The repository holds no
    # repository-level secrets by design, so nothing else is passed.
    secrets: inherit

  apply:
    needs: plan
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.plan.outputs.has_changes == 'true'
    uses: ./.github/workflows/_apply.yml
    permissions:
      contents: read
      id-token: write
    with:
      working_directory: azure/level-0-org
      environment: lab-azure-l0-apply
      artifact: ${{ needs.plan.outputs.artifact }}
    secrets: inherit
