name: evidence

# Collects an evidence pack from live Azure, redacts and scans it, then attests every file (ADR-0011).
# The attestation is recorded in the Sigstore public transparency log, so anyone can check later that a
# file came from this workflow in this repository, unchanged. A person then brings the pack into the
# repo through a normal pull request (docs/runbooks/evidence.md).
# checkov:skip=CKV_GHA_7:Not a build. The only input names the evidence folder and is validated before use.
on:
  workflow_dispatch:
    inputs:
      label:
        description: Folder name, for example 2026-11-19-aiservices (lowercase letters, digits and hyphens).
        type: string
        required: true

permissions: {}

concurrency:
  group: evidence
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    # Reader at the root management group: sees everything, changes nothing.
    environment: lab-azure-l0-plan
    permissions:
      contents: read
      id-token: write # OIDC for Azure, and the signing certificate for the attestation
      attestations: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate label
        env:
          LABEL: ${{ inputs.label }}
        run: |
          if ! [[ "$LABEL" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+$ ]]; then
            echo "Label must look like 2026-11-19-aiservices." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sign in with OIDC
        run: bash .github/scripts/az-login-oidc.sh

      - name: Collect
        env:
          LABEL: ${{ inputs.label }}
        run: bash .github/scripts/collect-evidence.sh "$LABEL" "$RUNNER_TEMP/evidence"

      # Nothing is attested unless the scan is clean (threat model T-08).
      - name: Redact and scan
        run: python3 -I .github/scripts/redact-evidence.py "$RUNNER_TEMP/evidence"

      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/evidence/*

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: evidence-${{ inputs.label }}
          path: ${{ runner.temp }}/evidence/
          retention-days: 90
          if-no-files-found: error

      # The pack is signed and kept either way; a failed policy test then fails the run so it is seen.
      - name: Policy tests passed
        run: jq -e '.passed == .total' "$RUNNER_TEMP/evidence/policy-tests.json"
