name: pr

# PR gates. No cloud credentials: every check runs offline or against mock providers.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      roots: ${{ steps.find.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every directory with a versions.tf is a root module or a local module.
      - id: find
        run: |
          roots=$(find . -name versions.tf -not -path '*/.terraform/*' -exec dirname {} \; | sed 's|^\./||' | sort | jq -R . | jq -sc .)
          echo "roots=$roots" >> "$GITHUB_OUTPUT"

  terraform:
    needs: discover
    if: needs.discover.outputs.roots != '[]'
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.discover.outputs.roots) }}
    uses: ./.github/workflows/_pr.yml
    with:
      working_directory: ${{ matrix.root }}

  secrets-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan full history, not just the tip
          persist-credentials: false

      # Binary download with checksum check, so no third-party action runs with repo access.
      - name: gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --redact --verbose .

  iac-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: checkov
        env:
          CHECKOV_VERSION: 3.3.30
        run: |
          pipx install "checkov==${CHECKOV_VERSION}"
          checkov --directory . --framework terraform github_actions --quiet --compact
